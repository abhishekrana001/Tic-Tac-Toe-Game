<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Premium Game</title>
    <meta name="description" content="Play the classic Tic Tac Toe game with a stunning premium dark UI design. Two players, one board!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- Winner / Draw overlay -->
    <div class="msg-container hide" id="msg-container" role="dialog" aria-modal="true" aria-labelledby="msg">
        <div class="msg-card">
            <div class="trophy-icon" id="result-icon">🏆</div>
            <p id="msg">Winner!</p>
            <button id="new-btn" class="btn btn-primary" aria-label="Start new game">
                <span>New Game</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.37"/></svg>
            </button>
        </div>
    </div>

    <main>
        <!-- Header -->
        <header class="game-header">
            <h1 class="game-title">
                <span class="x-letter">X</span>
                <span class="title-text">Tic Tac Toe</span>
                <span class="o-letter">O</span>
            </h1>
        </header>

        <!-- Turn indicator -->
        <div class="turn-indicator" id="turn-indicator" aria-live="polite">
            <div class="turn-badge" id="turn-badge">
                <span class="turn-symbol" id="turn-symbol">O</span>
                <span class="turn-text">Player's Turn</span>
            </div>
        </div>

        <!-- Score board -->
        <div class="scoreboard">
            <div class="score-item" id="score-o">
                <span class="score-label">Player O</span>
                <span class="score-num" id="score-o-val">0</span>
            </div>
            <div class="score-divider">vs</div>
            <div class="score-item" id="score-x">
                <span class="score-label">Player X</span>
                <span class="score-num" id="score-x-val">0</span>
            </div>
        </div>

        <!-- Game Grid -->
        <div class="container">
            <div class="game" id="game-board" role="grid" aria-label="Tic Tac Toe game board">
                <button class="box" id="box-0" aria-label="Cell 1" role="gridcell"></button>
                <button class="box" id="box-1" aria-label="Cell 2" role="gridcell"></button>
                <button class="box" id="box-2" aria-label="Cell 3" role="gridcell"></button>
                <button class="box" id="box-3" aria-label="Cell 4" role="gridcell"></button>
                <button class="box" id="box-4" aria-label="Cell 5" role="gridcell"></button>
                <button class="box" id="box-5" aria-label="Cell 6" role="gridcell"></button>
                <button class="box" id="box-6" aria-label="Cell 7" role="gridcell"></button>
                <button class="box" id="box-7" aria-label="Cell 8" role="gridcell"></button>
                <button class="box" id="box-8" aria-label="Cell 9" role="gridcell"></button>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <button id="reset-btn" class="btn btn-secondary" aria-label="Reset current game">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.37"/></svg>
                <span>Reset</span>
            </button>
            <button id="clear-score-btn" class="btn btn-ghost" aria-label="Clear scores">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                <span>Clear Scores</span>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
